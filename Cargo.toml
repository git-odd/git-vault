[package]
name = "git-vault"
version = "0.2.0"
edition = "2021"
description = "Zero-trace, Git-anchored private document and secret manager for open source developers"
license = "MIT"
readme = "README.md"
keywords = ["git", "vault", "secrets", "documentation", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glob = "0.3"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
