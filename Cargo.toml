[package]
name = "git-odd-vault"
version = "0.2.0"
edition = "2024"
authors = ["iroha3"]
description = "Zero-trace, Git-anchored private document and secret manager for open source developers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/git-odd/git-vault"
homepage = "https://github.com/git-odd/git-vault"
readme = "README.md"
keywords = ["git", "vault", "secrets", "documentation", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "git-vault"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glob = "0.3"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
